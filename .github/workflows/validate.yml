name: Validate corpus

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch every public head and tag for the privacy audit
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: check/package-lock.json
      - name: Install validation dependencies
        run: npm ci --prefix check --ignore-scripts
      - name: Check repository and fixture contracts
        run: node --test check/*.test.mjs
      - name: Regenerate fixture manifests and pages
        run: |
          for generator in build.mjs delivery.mjs patterns.mjs taxonomy.mjs journeys.mjs scenarios.mjs media.mjs flash.mjs color-independent.mjs ui-states.mjs surfaces.mjs guided.mjs needs-index.mjs coverage.mjs space-coverage.mjs manifest.mjs; do
            node "$generator"
          done
      - name: Check generated files are committed
        run: git diff --exit-code -I '"generated":'
