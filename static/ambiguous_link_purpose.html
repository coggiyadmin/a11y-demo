<!--
  Links without contextual purpose
  WCAG: 2.4.4
  Expectation: a control SHOULD report this
  Repeated links have the same generic text and no programmatic context that identifies their destinations.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Links without contextual purpose</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>Links without contextual purpose</h1>
<div><span>Flexible fare</span> <a href="#flexible">Learn more</a></div>
<div><span>Standard fare</span> <a href="#standard">Learn more</a></div>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
