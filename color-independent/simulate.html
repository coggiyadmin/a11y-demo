<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour-independence simulation</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>Colour-independence simulation</h1>
<p>Each fixture rendered through three colour-perception transformations and a
   monochrome transformation. Open a broken fixture in a filtered frame and ask whether
   the information survives. If it does not, colour was the only channel.</p>
<svg width="0" height="0" aria-hidden="true" focusable="false"><defs>
  <filter id="transform-a"><feColorMatrix type="matrix" values="
    0.567 0.433 0     0 0
    0.558 0.442 0     0 0
    0     0.242 0.758 0 0
    0     0     0     1 0"/></filter>
  <filter id="transform-b"><feColorMatrix type="matrix" values="
    0.625 0.375 0     0 0
    0.70  0.30  0     0 0
    0     0.30  0.70  0 0
    0     0     0     1 0"/></filter>
  <filter id="transform-c"><feColorMatrix type="matrix" values="
    0.95  0.05  0     0 0
    0     0.433 0.567 0 0
    0     0.475 0.525 0 0
    0     0     0     1 0"/></filter>
  <filter id="monochrome"><feColorMatrix type="matrix" values="
    0.299 0.587 0.114 0 0
    0.299 0.587 0.114 0 0
    0.299 0.587 0.114 0 0
    0     0     0     1 0"/></filter>
</defs></svg>
<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
  .grid figure{margin:0}
  .grid iframe{height:16rem}
  .p{filter:url(#transform-a)} .d{filter:url(#transform-b)}
  .t{filter:url(#transform-c)} .a{filter:url(#monochrome)}
</style>
<div class="grid">
  <figure>
    <figcaption>Unfiltered</figcaption>
    <iframe class="" src="./status_color_only.html" title="Status fixture, unfiltered"></iframe>
  </figure>
  <figure>
    <figcaption>Transformation A</figcaption>
    <iframe class="p" src="./status_color_only.html" title="Status fixture, transformation A"></iframe>
  </figure>
  <figure>
    <figcaption>Transformation B</figcaption>
    <iframe class="d" src="./status_color_only.html" title="Status fixture, transformation B"></iframe>
  </figure>
  <figure>
    <figcaption>Transformation C</figcaption>
    <iframe class="t" src="./status_color_only.html" title="Status fixture, transformation C"></iframe>
  </figure>
  <figure>
    <figcaption>Monochrome</figcaption>
    <iframe class="a" src="./status_color_only.html" title="Status fixture, monochrome"></iframe>
  </figure>
</div>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
