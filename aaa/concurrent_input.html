<!--
  WCAG 2.5.6 Concurrent Input Mechanisms (AAA)
  lane: stateful-interaction
  source: https://www.w3.org/WAI/WCAG22/Understanding/concurrent-input-mechanisms.html
  this page: broken
  defect: Once the control is used with a pointer the page switches to a pointer-only mode and removes the keyboard handler, so a person alternating between input mechanisms is locked out of one of them.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantity</title>
<link rel="stylesheet" href="../fixture.css">
</head>
<body>
<main>
<h1>Quantity</h1>
<p>Use the stepper with either a pointer or the keyboard.</p>
<p>
  <button type="button" id="dec">Decrease</button>
  <output id="n">1</output>
  <button type="button" id="inc">Increase</button>
</p>
<p id="mode" role="status">Input mode: any</p>
</main><p><a href="index.html">Back to the AAA index</a></p>
<p><a href="../index.html">Back to the index</a></p>
<script>
// Using a pointer disables the keyboard path. The restriction is not essential.
var value = 1;
var out = document.getElementById('n');
var mode = document.getElementById('mode');
var pointerOnly = false;

function step(by) { value = Math.max(1, value + by); out.textContent = String(value); }

function onKey(event) {
  if (pointerOnly) return;
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    step(event.target.id === 'inc' ? 1 : -1);
  }
}

['inc', 'dec'].forEach(function (id) {
  var el = document.getElementById(id);
  el.addEventListener('keydown', onKey);
  el.addEventListener('pointerdown', function () {
    pointerOnly = true;
    mode.textContent = 'Input mode: pointer only';
    step(id === 'inc' ? 1 : -1);
  });
});
</script>
</body>
</html>
