<!--
  Injected 600ms after load
  axis: client-rendered
  Carries the constant defect: 2.1.1 (div as button) and 1.1.1 (img with no alt).
  Expectation: a scanner SHOULD report both.
  Same as client_js but after a timer, past most "network idle" heuristics. Separates "does it run script" from "does it wait long enough".
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Injected 600ms after load</title>
<link rel="stylesheet" href="../fixture.css">
<script>addEventListener('load',()=>{setTimeout(()=>{document.getElementById('root').innerHTML="<div class=\"btn\" onclick=\"void 0\">Search flights</div>\n<img src=\"../pixel.png\">"},600)});</script>
</head>
<body>
<main>
<h1>Injected 600ms after load</h1>
<div id="root"><p>Loading…</p></div>
</main>
<p><a href="../index.html">Back to the index</a></p>
</body>
</html>
